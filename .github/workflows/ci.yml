name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Export API contract
        run: python scripts/export_api.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run isolated HTTP checks
        run: python scripts/test_api.py --isolated --report reports/api-report.json
      - name: Run release audit
        run: python scripts/release_audit.py
