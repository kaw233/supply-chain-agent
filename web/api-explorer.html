<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务工作台 · API 目录</title><style>body{font:14px/1.6 system-ui;background:#f6f7f9;color:#24343d;margin:0}header{padding:25px 4%;background:white;border-bottom:1px solid #ddd}main{max-width:1200px;margin:24px auto;padding:0 20px}input{padding:12px;border:1px solid #ccd3dc;width:70%}details{background:white;border:1px solid #dde2e6;border-radius:8px;margin:10px 0;padding:14px}summary{cursor:pointer}code{color:#bf4936}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f7f9;padding:16px;max-height:420px;overflow:auto}button{padding:7px 16px;border:1px solid #bbc7d0;background:white;border-radius:5px}small{color:#677a87}a{color:#a34032}</style><header><h2>API 目录 / 与实际路由同源</h2><a href="/api/openapi.json">OpenAPI JSON</a> · <a href="/api/catalog">全部操作与桥接目录</a> · <a href="/">返回业务工作台</a><p>在线仅列出接口和请求结构；批量验证请运行 scripts/test_api.py。发送、批准、停止不会因打开本页执行。</p></header><main><input id="q" placeholder="按路径、名称或用途搜索"><span id="count"></span><div id="rows"></div></main><script>let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const rs=all.filter(x=>JSON.stringify(x).toLowerCase().includes(q.value.toLowerCase()));count.textContent=' '+rs.length+' 项';rows.innerHTML=rs.map(x=>`<details><summary><b>${x.method}</b> <code>${esc(x.path)}</code> — ${esc(x.summary)} <small>${esc(x.effect)}</small></summary><pre>${esc(JSON.stringify(x,null,2))}</pre></details>`).join('')}fetch('/api/catalog').then(r=>r.json()).then(x=>{all=x.operations;render()});q.oninput=render;</script></html>
